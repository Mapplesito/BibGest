version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: bibgest_postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: bibgest_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: ./bibgest
    container_name: bibgest_frontend
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - db

volumes:
  pgdata: